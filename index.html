<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevAI - Asistente Pro de Programación</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        h1 {
            color: #58a6ff;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #8b949e;
            font-size: 14px;
        }
        .chat-container {
            width: 100%;
            max-width: 700px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .chat-box {
            height: 380px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 85%;
            font-size: 14px;
            line-height: 1.5;
        }
        .ai-message {
            background-color: #21262d;
            color: #c9d1d9;
            align-self: flex-start;
            border-left: 4px solid #58a6ff;
        }
        .user-message {
            background-color: #238636;
            color: white;
            align-self: flex-end;
        }
        .input-area {
            display: flex;
            padding: 15px;
            background-color: #0d1117;
            border-top: 1px solid #30363d;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 12px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: white;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #58a6ff;
        }
        button {
            padding: 0 20px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #2ea043;
        }
        pre {
            background: #0d1117;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            border: 1px solid #30363d;
            color: #79c0ff;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ DevAI Master Pro</h1>
        <p class="subtitle">Motor Híbrido de Programación (GPT + Gemini + Grok)</p>
    </header>

    <div class="chat-container">
        <div class="chat-box" id="chatBox">
            <div class="message ai-message">
                ¡Hola, Pietro! Soy DevAI, tu núcleo de programación definitivo. ¿Qué script, motor de juegos o depuración de código quieres que resolvamos hoy?
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Escribe tu duda de código o script aquí..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();

            if (text === '') return;

            // Mensaje del usuario
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.textContent = text;
            chatBox.appendChild(userDiv);

            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Simulación de respuesta experta de programación
            setTimeout(() => {
                const aiDiv = document.createElement('div');
                aiDiv.className = 'message ai-message';
                
                let responseText = "Analizando tu solicitud de código... Aquí tienes la estructura optimizada para tu proyecto:";
                if(text.toLowerCase().includes('roblox') || text.toLowerCase().includes('lua')) {
                    responseText = "Procesando motor Luau (Estilo Grok/Roblox):<br><pre>local part = script.Parent\nwhile true do\n    part.Color = Color3.fromRGB(math.random(0,255), math.random(0,255), math.random(0,255))\n    task.wait(1)\nend</pre>";
                } else if(text.toLowerCase().includes('python') || text.toLowerCase().includes('memoria') || text.toLowerCase().includes('temperatura')) {
                    responseText = "Generando script en Python (Modo Analítico):<br><pre>import psutil\nprint('CPU Usage:', psutil.cpu_percent())\nprint('RAM Used:', psutil.virtual_memory().percent, '%')</pre>";
                } else {
                    responseText = "Entendido, Pietro. Configurando el entorno de desarrollo para compilar limpio y sin errores.";
                }

                aiDiv.innerHTML = responseText;
                chatBox.appendChild(aiDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 800);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
